server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v1/profile/**, /api/v1/kyc/**
        - id: property-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/properties/**, /api/v1/wishlist/**
        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/bookings/**
        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/notifications/**
        - id: admin-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/admin/**
