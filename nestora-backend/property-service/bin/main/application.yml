server:
  port: 8082

spring:
  application:
    name: property-service
  r2dbc:
    url: r2dbc:h2:file:./db/property_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: password
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 2s
    socket-timeout: 2s
